			// Esto es IA, para convertir de coordenadas a Latitud y Longitud
			/////////////////////////////////////////////////////////
			function utmToLatLon(easting, northing, zone = 30, isNorthernHemisphere = true) {
				const a = 6378137.0; // WGS84 semi-major axis (meters)
				const f = 1 / 298.257223563; // WGS84 flattening
				const k0 = 0.9996; // UTM scale factor

				const e2 = f * (2 - f);
				const ep2 = e2 / (1 - e2);

				const x = easting - 500000.0;
				const y = isNorthernHemisphere ? northing : northing - 10000000.0;

				const lonOrigin = (zone - 1) * 6 - 180 + 3; // Central meridian in degrees
				const lonOriginRad = (lonOrigin * Math.PI) / 180;

				const M = y / k0;
				const mu =
					M /
					(a *
					(1 -
						e2 / 4 -
						(3 * e2 * e2) / 64 -
						(5 * e2 * e2 * e2) / 256));

				const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));

				const phi1Rad =
					mu +
					((3 * e1) / 2 - (27 * Math.pow(e1, 3)) / 32) * Math.sin(2 * mu) +
					((21 * e1 * e1) / 16 - (55 * Math.pow(e1, 4)) / 32) * Math.sin(4 * mu) +
					((151 * Math.pow(e1, 3)) / 96) * Math.sin(6 * mu) +
					((1097 * Math.pow(e1, 4)) / 512) * Math.sin(8 * mu);

				const sinPhi1 = Math.sin(phi1Rad);
				const cosPhi1 = Math.cos(phi1Rad);
				const tanPhi1 = Math.tan(phi1Rad);

				const N1 = a / Math.sqrt(1 - e2 * sinPhi1 * sinPhi1);
				const T1 = tanPhi1 * tanPhi1;
				const C1 = ep2 * cosPhi1 * cosPhi1;
				const R1 = (a * (1 - e2)) / Math.pow(1 - e2 * sinPhi1 * sinPhi1, 1.5);
				const D = x / (N1 * k0);

				const latRad =
					phi1Rad -
					((N1 * tanPhi1) / R1) *
					((D * D) / 2 -
						((5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * Math.pow(D, 4)) / 24 +
						((61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * ep2 - 3 * C1 * C1) *
						Math.pow(D, 6)) /
						720);

				const lonRad =
					lonOriginRad +
					(D -
					((1 + 2 * T1 + C1) * Math.pow(D, 3)) / 6 +
					((5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) *
						Math.pow(D, 5)) /
						120) /
					cosPhi1;

				return {
					lat: (latRad * 180) / Math.PI,
					lon: (lonRad * 180) / Math.PI,
				};
				}
